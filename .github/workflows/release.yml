# Pushing a tag vX.Y.Z builds Lectern Audio X.Y.Z, signed with the owner's Apple Development certificate, and publishes a GitHub Release with the DMG,
# the ZIP and the Sparkle appcast.xml. The build number is the run number, so Sparkle always sees it grow.
name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release, e.g. v0.2.0
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Tag must look like v1.2.3, got $TAG"; exit 1; }
          git checkout "refs/tags/$TAG"
      # Saved by the ci.yml run that automerge dispatches on main after each merge (arm64, the runner's architecture). A tag can't reuse caches saved on another tag.
      - uses: actions/cache/restore@v4
        with:
          path: |
            build/ffmpeg-8.0
            build/aria2-1.37.0
          key: helpers-macOS-${{ hashFiles('scripts/build-ffmpeg.sh', 'scripts/build-aria2.sh') }}
      - id: sparkle
        run: |
          echo "version=$(grep -A3 '^  Sparkle:' project.yml | sed -n 's/.*exactVersion: *"\(.*\)"/\1/p')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        with:
          path: build/SourcePackages
          key: spm-xcode-sparkle${{ steps.sparkle.outputs.version }}-${{ hashFiles('Packages/AudibleCore/Package.resolved') }}
          restore-keys: spm-xcode-
      - name: Install XcodeGen
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip
          echo "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 --check
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
      - run: xcodegen generate
      # A certificate gives every version the same designated requirement, so the Keychain's "Always Allow"
      # for the Audible sign-in survives updates. An ad-hoc signature's requirement is its cdhash, which
      # changes every build. The secrets hold the certificate and key as base64 .p12 and its password.
      - name: Import signing certificate
        env:
          P12: ${{ secrets.SIGNING_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          [ -n "$P12" ] || { echo "Missing secret SIGNING_CERTIFICATE_P12"; exit 1; }
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(uuidgen)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/signing.p12"
          curl -fsSL -o "$RUNNER_TEMP/wwdr.cer" https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer
          security import "$RUNNER_TEMP/wwdr.cer" -k "$keychain" || true
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity=$(security find-identity -v -p codesigning "$keychain" | awk '/Apple Development/ { print $2; exit }')
          [ -n "$identity" ] || { security find-identity -p codesigning "$keychain"; exit 1; }
          echo "SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
      - name: Build, sign and package
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: scripts/release.sh "${TAG#v}" "$BUILD_NUMBER"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${TAG#v}"
          gh release create "$TAG" --verify-tag --title "Lectern Audio $version" --generate-notes \
            "build/release/LecternAudio-$version.dmg" "build/release/LecternAudio-$version.zip" build/release/appcast.xml
