name: CI
on:
  pull_request:
  push:
    branches: [main]
  # Automerge merges with GITHUB_TOKEN, which fires no push event, so it dispatches this on main after each merge.
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
# Caches are saved only on main (push or dispatch) and only restored on PRs: a cache saved under
# refs/pull/N/merge is readable by that PR alone.
jobs:
  # Docs-only PRs skip the build jobs. The run still ends in success, so automerge (workflow_run) fires;
  # paths-ignore would skip the whole run and the PR would never merge.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
      deps: ${{ steps.diff.outputs.deps }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        run: |
          # On main only macos-build has to run: its DerivedData key is the commit. core-linux's cache is keyed by
          # Package.resolved, so it runs there only when a dependency or a cache path (ci.yml) changed.
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo code=true
            if git diff --name-only HEAD~1 HEAD | grep -qE '(^|/)Package\.(swift|resolved)$|^\.github/workflows/ci\.yml$' ||
              git diff HEAD~1 HEAD -- project.yml | grep -qE '^[-+] *(url|exactVersion|from|branch|revision):'; then
              echo deps=true
            else
              echo deps=false
            fi
            exit 0
          fi >> "$GITHUB_OUTPUT"
          files=$(git diff --name-only "origin/$GITHUB_BASE_REF...HEAD")
          if grep -qvE '\.md$|^docs/' <<< "$files"; then echo code=true; else echo code=false; fi >> "$GITHUB_OUTPUT"
  core-linux:
    needs: changes
    if: needs.changes.outputs.code == 'true' && (github.event_name == 'pull_request' || needs.changes.outputs.deps == 'true')
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - uses: actions/checkout@v4
      # Dependencies (swift-crypto/BoringSSL) are ~95% of the compile; SwiftPM rebuilds only what changed.
      - id: spm-linux
        uses: actions/cache/restore@v4
        with:
          path: Packages/AudibleCore/.build
          key: spm-linux-swift6.1-${{ hashFiles('Packages/AudibleCore/Package.resolved') }}
          restore-keys: spm-linux-swift6.1-
      # No --disable-index-store here: on Linux, swift test finds tests through the index store, and a cached
      # .build without units for a new test file fails with "Failed opening .../index/store/v5/units/...".
      - run: swift test --package-path Packages/AudibleCore
      - if: github.event_name != 'pull_request' && steps.spm-linux.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: Packages/AudibleCore/.build
          key: ${{ steps.spm-linux.outputs.cache-primary-key }}
  # The app build, the AudibleCore tests and the launch smoke test share one runner and one DerivedData. The
  # tests ran as `swift test` on a second runner with a cached .build, but a .build saved on another runner image
  # rebuilt every C object (the SDK headers' mtimes change with each image build; BoringSSL, about 65 s), and
  # xcodebuild's build system reuses them (PR #93, docs/memory.md).
  macos-build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      # FFmpeg and aria2c built from source. Saved on main, so the cache, readable from every branch and tag,
      # also serves release.yml.
      - id: helpers
        uses: actions/cache/restore@v4
        with:
          path: |
            build/ffmpeg-8.0
            build/aria2-1.37.0
          key: helpers-macOS-${{ hashFiles('scripts/build-ffmpeg.sh', 'scripts/build-aria2.sh') }}
      # Products, module caches and object files of the last main build, plus package checkouts and the Sparkle
      # binary (build/SourcePackages) and the SwiftPM manifest cache, in one archive. Package sources keep their
      # cached mtimes, so their objects (BoringSSL, most of the C compile) are reused; the checkout's files
      # rebuild. release.yml restores this same path list.
      - id: dd
        uses: actions/cache/restore@v4
        with:
          path: |
            build/Build
            build/ModuleCache.noindex
            build/SDKExplicitPrecompiledModules
            build/SourcePackages
          key: dd-macos-${{ github.sha }}
          restore-keys: dd-macos-
      - name: Install XcodeGen
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip
          echo "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 --check
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
      - run: xcodegen generate
      # The AudibleCoreTests scheme (project.yml) builds the app for testing and runs the package's tests from the
      # test bundle. The first lines show when the build really starts, the last ones the test results; the full log
      # stays in $RUNNER_TEMP for the rest of the job.
      - run: |
          xcodebuild test -scheme AudibleCoreTests -destination 'platform=macOS,arch=arm64' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO \
            | tee "$RUNNER_TEMP/xcodebuild.log" | awk 'NR <= 20 { print; fflush() }' || status=$?
          echo ...
          tail -80 "$RUNNER_TEMP/xcodebuild.log"
          exit "${status:-0}"
        shell: bash -o pipefail {0}
      # The snapshot tests can't run here and their host never takes the real launch path, which crashed in #63
      # and #64. Launch the app with the fixture library (it is also a valid synced list) once in list and once in
      # grid mode. LECTERN_SNAPSHOT writes the PNG and quits. Only on PRs: automerge merges the commit the PR run
      # launched, and main runs exist to save caches.
      - name: Launch smoke test
        if: github.event_name == 'pull_request'
        run: |
          mkdir -p "$RUNNER_TEMP/lib" "$RUNNER_TEMP/shots"
          cp Packages/AudibleCore/Tests/AudibleCoreTests/Fixtures/books.json "$RUNNER_TEMP/lib/"
          app="build/Build/Products/Debug/Lectern Audio.app/Contents/MacOS/Lectern Audio"
          for mode in NO YES; do
            shot="$RUNNER_TEMP/shots/shot-viewMode$mode.png"
            start=$SECONDS
            status=0
            # perl alarm is the timeout (no coreutils on the runner): SIGALRM, exit 142, after 60 s.
            LECTERN_LIBRARY="$RUNNER_TEMP/lib" LECTERN_SYNCED_LIBRARY="$RUNNER_TEMP/lib/books.json" LECTERN_SNAPSHOT="$shot" \
              perl -e 'alarm shift; exec @ARGV or die' 60 "$app" -viewMode $mode -SUEnableAutomaticChecks NO || status=$?
            echo "viewMode $mode: exit $status in $((SECONDS - start)) s"
            if [ "$status" -ne 0 ] || [ ! -s "$shot" ]; then
              echo "::error::Launch failed (viewMode $mode, exit $status; 142 is the timeout, 134 an abort)"
              exit 1
            fi
          done
      - if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: launch-snapshots
          path: ${{ runner.temp }}/shots
          if-no-files-found: ignore
      # Save keys come from the restore steps: hashFiles here would see Package.resolved after the build rewrote it.
      # Exact-key hits are skipped: the key exists, so the save fails with "Unable to reserve cache" after tarring it.
      - if: github.event_name != 'pull_request' && steps.helpers.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            build/ffmpeg-8.0
            build/aria2-1.37.0
          key: ${{ steps.helpers.outputs.cache-primary-key }}
      - if: github.event_name != 'pull_request'
        uses: actions/cache/save@v4
        with:
          path: |
            build/Build
            build/ModuleCache.noindex
            build/SDKExplicitPrecompiledModules
            build/SourcePackages
          key: ${{ steps.dd.outputs.cache-primary-key }}
