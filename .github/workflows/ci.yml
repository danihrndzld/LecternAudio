name: CI
on:
  pull_request:
  push:
    branches: [main]
  # Automerge merges with GITHUB_TOKEN, which fires no push event, so it dispatches this on main after each merge.
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
# Caches are saved only on main (push or dispatch) and only restored on PRs: a cache saved under
# refs/pull/N/merge is readable by that PR alone.
jobs:
  # Docs-only PRs skip the build jobs. The run still ends in success, so automerge (workflow_run) fires;
  # paths-ignore would skip the whole run and the PR would never merge.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then echo code=true >> "$GITHUB_OUTPUT"; exit 0; fi
          files=$(git diff --name-only "origin/$GITHUB_BASE_REF...HEAD")
          if grep -qvE '\.md$|^docs/' <<< "$files"; then echo code=true; else echo code=false; fi >> "$GITHUB_OUTPUT"
  core-linux:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - uses: actions/checkout@v4
      # Dependencies (swift-crypto/BoringSSL) are ~95% of the compile; SwiftPM rebuilds only what changed.
      - id: spm-linux
        uses: actions/cache/restore@v4
        with:
          path: Packages/AudibleCore/.build
          key: spm-linux-swift6.1-${{ hashFiles('Packages/AudibleCore/Package.resolved') }}
          restore-keys: spm-linux-swift6.1-
      # No --disable-index-store here: on Linux, swift test finds tests through the index store, and a cached
      # .build without units for a new test file fails with "Failed opening .../index/store/v5/units/...".
      - run: swift test --package-path Packages/AudibleCore
      - if: github.event_name != 'pull_request' && steps.spm-linux.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: Packages/AudibleCore/.build
          key: ${{ steps.spm-linux.outputs.cache-primary-key }}
  # Tests and the app build run on separate runners in parallel (standard runners are free on public repos).
  macos-test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - id: spm-macos
        uses: actions/cache/restore@v4
        with:
          path: Packages/AudibleCore/.build
          key: spm-macos-${{ hashFiles('Packages/AudibleCore/Package.resolved') }}
          restore-keys: spm-macos-
      - run: swift test --package-path Packages/AudibleCore --disable-index-store
      - if: github.event_name != 'pull_request' && steps.spm-macos.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: Packages/AudibleCore/.build
          key: ${{ steps.spm-macos.outputs.cache-primary-key }}
  macos-build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      # FFmpeg and aria2c built from source. Saved on main, so the cache, readable from every branch and tag,
      # also serves release.yml.
      - id: helpers
        uses: actions/cache/restore@v4
        with:
          path: |
            build/ffmpeg-8.0
            build/aria2-1.37.0
          key: helpers-macOS-${{ hashFiles('scripts/build-ffmpeg.sh', 'scripts/build-aria2.sh') }}
      # Package checkouts and the Sparkle binary, otherwise cloned and downloaded on every run. Sparkle is pinned
      # in project.yml, so the key holds its version instead of a hash of the whole file.
      - id: sparkle
        run: |
          echo "version=$(grep -A3 '^  Sparkle:' project.yml | sed -n 's/.*exactVersion: *"\(.*\)"/\1/p')" >> "$GITHUB_OUTPUT"
      - id: spm-xcode
        uses: actions/cache/restore@v4
        with:
          path: build/SourcePackages
          key: spm-xcode-sparkle${{ steps.sparkle.outputs.version }}-${{ hashFiles('Packages/AudibleCore/Package.resolved') }}
          restore-keys: spm-xcode-
      # Products, module caches and object files of the last main build. Package sources keep their cached
      # mtimes, so their objects (BoringSSL, most of the C compile) are reused; the checkout's files rebuild.
      - id: dd
        uses: actions/cache/restore@v4
        with:
          path: |
            build/Build
            build/ModuleCache.noindex
            build/SDKExplicitPrecompiledModules
          key: dd-macos-${{ github.sha }}
          restore-keys: dd-macos-
      - name: Install XcodeGen
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip
          echo "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 --check
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
      - run: xcodegen generate
      - run: |
          xcodebuild -scheme LecternAudio -destination platform=macOS -derivedDataPath build -showBuildTimingSummary build \
            CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO | tail -80
        shell: bash -o pipefail {0}
      # The snapshot tests can't run here and their host never takes the real launch path, which crashed in #63
      # and #64. Launch the app with the fixture library (it is also a valid synced list) in list and grid mode,
      # 3 times each because a timing crash can pass once. LECTERN_SNAPSHOT writes the PNG and quits.
      - name: Launch smoke test
        run: |
          mkdir -p "$RUNNER_TEMP/lib" "$RUNNER_TEMP/shots"
          cp Packages/AudibleCore/Tests/AudibleCoreTests/Fixtures/books.json "$RUNNER_TEMP/lib/"
          app="build/Build/Products/Debug/Lectern Audio.app/Contents/MacOS/Lectern Audio"
          for mode in NO YES; do
            for i in 1 2 3; do
              shot="$RUNNER_TEMP/shots/shot-viewMode$mode-$i.png"
              start=$SECONDS
              status=0
              # perl alarm is the timeout (no coreutils on the runner): SIGALRM, exit 142, after 60 s.
              LECTERN_LIBRARY="$RUNNER_TEMP/lib" LECTERN_SYNCED_LIBRARY="$RUNNER_TEMP/lib/books.json" LECTERN_SNAPSHOT="$shot" \
                perl -e 'alarm shift; exec @ARGV or die' 60 "$app" -viewMode $mode -SUEnableAutomaticChecks NO || status=$?
              echo "viewMode $mode run $i: exit $status in $((SECONDS - start)) s"
              if [ "$status" -ne 0 ] || [ ! -s "$shot" ]; then
                echo "::error::Launch failed (viewMode $mode run $i, exit $status; 142 is the timeout, 134 an abort)"
                exit 1
              fi
            done
          done
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: launch-snapshots
          path: ${{ runner.temp }}/shots
          if-no-files-found: ignore
      # Save keys come from the restore steps: hashFiles here would see Package.resolved after the build rewrote it.
      # Exact-key hits are skipped: the key exists, so the save fails with "Unable to reserve cache" after tarring it.
      - if: github.event_name != 'pull_request' && steps.helpers.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            build/ffmpeg-8.0
            build/aria2-1.37.0
          key: ${{ steps.helpers.outputs.cache-primary-key }}
      - if: github.event_name != 'pull_request' && steps.spm-xcode.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/SourcePackages
          key: ${{ steps.spm-xcode.outputs.cache-primary-key }}
      - if: github.event_name != 'pull_request'
        uses: actions/cache/save@v4
        with:
          path: |
            build/Build
            build/ModuleCache.noindex
            build/SDKExplicitPrecompiledModules
          key: ${{ steps.dd.outputs.cache-primary-key }}
