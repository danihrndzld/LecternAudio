name: Earmark
options:
  bundleIdPrefix: com.danihrndzld
  deploymentTarget:
    macOS: "26.0"
packages:
  AudibleCore:
    path: Packages/AudibleCore
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Earmark:
    type: application
    platform: macOS
    sources: [App/Sources]
    dependencies:
      - package: AudibleCore
    postBuildScripts:
      - name: Build and embed FFmpeg
        script: /bin/bash "$SRCROOT/scripts/build-ffmpeg.sh"
        basedOnDependencyAnalysis: false
    entitlements:
      path: App/Earmark.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.danihrndzld.earmark
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Earmark
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.entertainment
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
schemes:
  Earmark:
    build:
      targets:
        Earmark: all
