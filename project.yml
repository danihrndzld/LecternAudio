name: LecternAudio
options:
  bundleIdPrefix: com.danihrndzld
  deploymentTarget:
    macOS: "26.0"
packages:
  AudibleCore:
    path: Packages/AudibleCore
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: "2.10.0"
  SnapshotTesting:
    url: https://github.com/pointfreeco/swift-snapshot-testing
    exactVersion: "1.19.6"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "1"
    # Sparkle appcast. Change this one line to move releases to another repo or name.
    LECTERN_FEED_URL: https://github.com/danihrndzld/LecternAudio/releases/latest/download/appcast.xml
targets:
  LecternAudio:
    type: application
    platform: macOS
    sources: [App/Sources, App/Resources]
    dependencies:
      - package: AudibleCore
      - package: Sparkle
    postBuildScripts:
      - name: Build and embed FFmpeg
        script: /bin/bash "$SRCROOT/scripts/build-ffmpeg.sh"
        basedOnDependencyAnalysis: false
      - name: Build and embed aria2c
        script: /bin/bash "$SRCROOT/scripts/build-aria2.sh"
        basedOnDependencyAnalysis: false
    info:
      path: App/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        SUFeedURL: $(LECTERN_FEED_URL)
        SUPublicEDKey: 6AlIbh3SEK9GPYRrelmHV7OdKneR9qJMyjkGxzNKQoM=
        SUEnableInstallerLauncherService: true
        SUEnableAutomaticChecks: true
    entitlements:
      path: App/LecternAudio.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
        # Ad-hoc signatures have no Team ID, so hardened runtime's library validation would refuse to load Sparkle.framework.
        com.apple.security.cs.disable-library-validation: true
        # Sparkle's installer launcher service: https://sparkle-project.org/documentation/sandboxing/
        com.apple.security.temporary-exception.mach-lookup.global-name:
          - $(PRODUCT_BUNDLE_IDENTIFIER)-spks
          - $(PRODUCT_BUNDLE_IDENTIFIER)-spki
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.danihrndzld.lecternaudio
        PRODUCT_NAME: Lectern Audio
        # Without this the module is "Lectern_Audio", sanitized from PRODUCT_NAME.
        PRODUCT_MODULE_NAME: LecternAudio
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Lectern Audio
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.entertainment
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
  LecternAudioTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      # The references are read from the source tree, not copied into the bundle.
      - path: App/Tests
        excludes: ["__Snapshots__"]
    dependencies:
      - target: LecternAudio
      - package: SnapshotTesting
        product: SnapshotTesting
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.danihrndzld.lecternaudio.tests
        GENERATE_INFOPLIST_FILE: YES
        # PRODUCT_NAME is "Lectern Audio", so the host path cannot be derived from the target name.
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Lectern Audio.app/Contents/MacOS/Lectern Audio
        BUNDLE_LOADER: $(TEST_HOST)
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
schemes:
  LecternAudio:
    build:
      targets:
        LecternAudio: all
        LecternAudioTests: [test]
    test:
      targets: [LecternAudioTests]
